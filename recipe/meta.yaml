{% set pname = "aihwkit" %}      # [cuda_compiler_version == "None"]
{% set pname = "aihwkit-gpu" %}  # [cuda_compiler_version != "None"]
{% set name = "aihwkit" %}
{% set version = "1.2.0" %}
{% set number = 0 %}

package:
  name: {{ pname|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 288b00aed52a99f578a2e7ac46fdbf2a9f07e4780c4307eae5827558f1bf2cba

build:
  skip: true  # [win or osx or py<312 or py>315 or (cuda_compiler_version == "12.9" and py == 314)]
  ignore_run_exports_from:
    - libcusolver-dev  # [cuda_compiler_version != "None"]
    - libcusparse-dev  # [cuda_compiler_version != "None"]
    - pytorch
    - python
  number: {{ number }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - {{ compiler('cuda') }}  # [cuda_compiler_version != "None"]
    - cmake >=4.2.1
    - make
    - ninja
    - libgomp  # [linux]
    - openblas
  host:
    - cuda-version {{ cuda_compiler_version }}  # [cuda_compiler_version != "None"]
    - libcublas-dev                             # [cuda_compiler_version != "None"]
    - libcurand-dev                             # [cuda_compiler_version != "None"]
    - python
    - openblas
    - blas
    - scikit-build >=0.18.1
    - pip
    - pybind11 >=3.0.1
    - setuptools >=77.0.0
    - wheel
    - numpy
    - mypy
    - pytorch * cuda*                           # [cuda_compiler_version != "None"]
    - pytorch                                   # [cuda_compiler_version == "None"]
    ########################################################################################################################################
    # Needed because PyTorch's ATen `#include`s them                                                                                       #
    # xref: https://github.com/pytorch/pytorch/blob/50efbb9f1e7111b4b6d5b8e9a6064ee9783930be/aten/src/ATen/cuda/CUDAContextLight.h#L6-L16  #
    ########################################################################################################################################
    - libcusolver-dev                           # [cuda_compiler_version != "None"]
    - libcusparse-dev                           # [cuda_compiler_version != "None"]
  run:
    - python
    - libopenblas
    - blas
    - numpy
    - torchvision
    - requests >=2.32,<3
    - protobuf
    - scipy
    - scikit-learn
    - tqdm
    - pytorch * cuda*    # [cuda_compiler_version != "None"]
    - pytorch * cpu*     # [cuda_compiler_version == "None"]
test:
  imports:
    - aihwkit
    - aihwkit.simulator

about:
  home: https://github.com/IBM/aihwkit
  summary: 'A toolkit for exploring and using the capabilities of in-memory computing devices for AI.'
  license: MIT
  license_file: LICENSE.txt
  doc_url: https://aihwkit.readthedocs.io/
  dev_url: https://github.com/IBM/aihwkit

extra:
  recipe-maintainers:
    - kaoutar55
    - PabloCarmona
